services:
  cloudsave:
    image: cloudsave-assistant:1.2.1
    platform: linux/amd64
    container_name: cloudsave
    restart: unless-stopped
    ports:
      - "${CLOUDSAVE_BIND_IP:-0.0.0.0}:${CLOUDSAVE_PORT:-5800}:5800"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      USER_ID: ${USER_ID:-1000}
      GROUP_ID: ${GROUP_ID:-1000}
      WEB_AUTHENTICATION_USERNAME: ${CLOUDSAVE_USERNAME:-admin}
      WEB_AUTHENTICATION_PASSWORD: ${CLOUDSAVE_PASSWORD:?请先在.env中设置CLOUDSAVE_PASSWORD}
      SECURE_CONNECTION: "1"
      WEB_AUTHENTICATION: "1"
      WEB_FILE_MANAGER_ALLOWED_PATHS: /output
      VNC_LISTENING_PORT: "-1"
      DISPLAY_WIDTH: ${DISPLAY_WIDTH:-1600}
      DISPLAY_HEIGHT: ${DISPLAY_HEIGHT:-1000}
    volumes:
      - ./config:/config
      - ./output:/output
    shm_size: 1gb
    stop_grace_period: 90s
