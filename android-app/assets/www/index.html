<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>云存助手</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="boot-error" class="boot-error" hidden></div>

<header>
  <div class="title">云存助手 <span class="tag">手机独立版</span></div>
  <div class="account">115：<b id="account" class="warn">未登录</b>
    <button id="login" class="small">登录</button>
    <button id="logout" class="small" hidden>退出</button>
  </div>
</header>

<main>
  <section class="card">
    <h2>1. 登录</h2>
    <p class="hint">点「登录」会打开 115 的网页，扫码或输入账号密码登录成功后返回即可，凭据从系统 WebView 里读取，只存在这台手机上。</p>
    <button id="paste-toggle" class="ghost">改用手动粘贴 Cookie</button>
    <div id="paste-box" hidden>
      <textarea id="cookie" rows="3" placeholder="UID=…; CID=…; SEID=…" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>
      <button id="paste-save">使用这段 Cookie</button>
    </div>
  </section>

  <section class="card">
    <h2>2. 保存目录</h2>
    <p class="hint">转存目标：<b id="folder-name" class="warn">未选择</b></p>
    <button id="browse">选择目录</button>
    <div id="folder-panel" class="panel" hidden>
      <div class="trail-row"><span id="trail"></span><button id="close-folders" class="small right">关闭</button></div>
      <div id="folder-list"></div>
      <button id="pick-folder">保存到这一层</button>
    </div>
  </section>

  <section class="card">
    <h2>3. 转存分享</h2>
    <input id="link" type="url" inputmode="url" placeholder="https://115.com/s/xxxxxx" autocomplete="off" spellcheck="false">
    <input id="code" maxlength="4" placeholder="提取码（可留空）" autocomplete="off" spellcheck="false">
    <div class="actions">
      <button id="scan">扫描分享</button>
      <button id="transfer">转存到所选目录</button>
    </div>
    <p id="summary" class="summary"></p>
    <label class="check"><input id="verify" type="checkbox" checked><span>转存后逐项核验目标目录（更稳，但每个目录要多等一秒）</span></label>
    <div class="status-row"><span id="busy" class="busy"></span><button id="cancel" class="small right" hidden>取消</button></div>
  </section>

  <section class="card">
    <h2>运行日志 <button id="clear-log" class="small right">清空</button></h2>
    <div id="log" class="log"></div>
  </section>

  <footer id="about"></footer>
</main>

<script src="cloudsave-modules.js"></script>
<script src="host.js"></script>
<script src="app.js"></script>
</body>
</html>
